<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Neon Yokocho</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Chakra+Petch:wght@400;500;600&family=Dela+Gothic+One&family=Zen+Kaku+Gothic+New:wght@700&display=swap">
<style>
/* Layout: full-bleed 3D alley; a neon title top-left and one control dock along the bottom edge. */
:root{
  --ink:#eef1ff;
  --ink-dim:rgba(222,228,255,.72);
  --glass:rgba(10,8,22,.56);
  --glass-line:rgba(170,180,255,.18);
  --pink:#ff3fd8;
  --cyan:#3fe9ff;
  --ground:#05040a;
  --pill-ink:#0b0a14;
  --display:'Dela Gothic One','Chakra Petch',sans-serif;
  --ui:'Chakra Petch',ui-sans-serif,system-ui,-apple-system,'Segoe UI',sans-serif;
  color-scheme:dark;
}
html,body{height:100%;margin:0;overflow:hidden}
body{background:var(--ground);color:var(--ink);font-family:var(--ui);-webkit-font-smoothing:antialiased}
#scene{position:fixed;inset:0;width:100%;height:100%;display:block;touch-action:none;outline:none;cursor:grab}
#scene:active{cursor:grabbing}
.brand{position:fixed;top:calc(env(safe-area-inset-top,0px) + 18px);left:max(18px,calc(env(safe-area-inset-left,0px) + 18px));pointer-events:none}
.brand h1{font-family:var(--display);font-weight:400;font-size:clamp(28px,4vw,42px);line-height:1;margin:0;letter-spacing:.01em;color:#ffe6fb;text-shadow:0 0 6px var(--pink),0 0 18px var(--pink),0 0 42px rgba(255,63,216,.55)}
.brand h1 span{display:block;margin-top:6px;font-size:.42em;letter-spacing:.3em;color:#e6fdff;text-shadow:0 0 6px var(--cyan),0 0 16px var(--cyan)}
.brand p{margin:10px 0 0;font-size:12px;font-weight:600;letter-spacing:.16em;text-transform:uppercase;color:var(--ink-dim);font-variant-numeric:tabular-nums;text-shadow:0 1px 10px rgba(0,0,0,.8)}
.dock{position:fixed;left:0;right:0;bottom:0;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:0 calc(env(safe-area-inset-bottom,0px) + 16px);display:flex;flex-wrap:wrap;align-items:flex-end;justify-content:space-between;gap:10px 16px;pointer-events:none}
.dock > *{pointer-events:auto}
.controls{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.seg{display:flex;gap:2px;padding:4px;border-radius:999px;background:var(--glass);border:1px solid var(--glass-line);-webkit-backdrop-filter:blur(12px);backdrop-filter:blur(12px)}
.dock button{font:500 13px/1 var(--ui);letter-spacing:.04em;color:var(--ink-dim);background:transparent;border:0;padding:9px 13px;border-radius:999px;cursor:pointer;white-space:nowrap;transition:background .2s,color .2s,box-shadow .2s}
.dock button:hover{color:var(--ink)}
.seg button[aria-pressed="true"]{background:var(--ink);color:var(--pill-ink);box-shadow:0 0 14px rgba(63,233,255,.55)}
.dock button:focus-visible{outline:2px solid var(--cyan);outline-offset:2px}
.pill{background:var(--glass)!important;border:1px solid var(--glass-line)!important;-webkit-backdrop-filter:blur(12px);backdrop-filter:blur(12px);padding:12px 15px!important;display:flex;align-items:center;gap:8px}
.pill .dot{width:7px;height:7px;border-radius:50%;background:currentColor;opacity:.45}
.pill[aria-pressed="true"]{color:var(--ink)!important;border-color:rgba(63,233,255,.55)!important}
.pill[aria-pressed="true"] .dot{opacity:1;background:var(--cyan);box-shadow:0 0 8px var(--cyan)}
.keys{margin:0;font-size:12px;color:var(--ink-dim);text-shadow:0 1px 10px rgba(0,0,0,.8);max-width:46ch;line-height:1.6;pointer-events:none}
.keys kbd{font:600 11px var(--ui);border:1px solid var(--glass-line);background:var(--glass);border-radius:5px;padding:1px 5px;color:var(--ink)}
#joy[hidden],#boot[hidden]{display:none}
#joy{position:fixed;left:0;top:0;width:110px;height:110px;margin:-55px 0 0 -55px;border-radius:50%;border:1.5px solid var(--glass-line);background:rgba(10,8,22,.3);pointer-events:none}
#knob{position:absolute;left:50%;top:50%;width:44px;height:44px;margin:-22px 0 0 -22px;border-radius:50%;background:var(--ink);opacity:.85;box-shadow:0 0 14px var(--cyan)}
#boot{position:fixed;inset:0;display:grid;place-items:center;background:var(--ground);font:600 13px var(--ui);letter-spacing:.3em;text-transform:uppercase;color:var(--cyan);text-shadow:0 0 10px var(--cyan)}
@media (max-width:640px){.keys{display:none}.dock button{padding:9px 10px;font-size:12.5px}}
</style>
</head>
<body>
<canvas id="scene" tabindex="0" aria-label="A walker strolling through a neon-lit Tokyo back alley at night, with shops, passers-by and optional rain"></canvas>

<header class="brand">
  <h1>Neon Yokochō<span lang="ja">ネオン横丁</span></h1>
  <p id="status">23:47 · Dry streets</p>
</header>

<div class="dock">
  <div class="controls">
    <div class="seg" role="group" aria-label="Rain">
      <button type="button" data-r="0" aria-pressed="true">Dry</button>
      <button type="button" data-r="1" aria-pressed="false">Drizzle</button>
      <button type="button" data-r="2" aria-pressed="false">Downpour</button>
    </div>
    <button type="button" id="auto" class="pill" aria-pressed="true"><i class="dot"></i>Auto-stroll</button>
    <button type="button" id="sound" class="pill" aria-pressed="true"><i class="dot"></i>Sound</button>
  </div>
  <p class="keys"><kbd>W</kbd><kbd>A</kbd><kbd>S</kbd><kbd>D</kbd> walk · <kbd>Shift</kbd> run · drag to look around · scroll to zoom · <kbd>R</kbd> rain</p>
</div>

<div id="joy" hidden><div id="knob"></div></div>
<div id="boot">Wiring up the neon…</div>

<script type="importmap">
{"imports":{"three":"https://cdn.jsdelivr.net/npm/three@0.170.0/build/three.module.js","three/addons/":"https://cdn.jsdelivr.net/npm/three@0.170.0/examples/jsm/"}}
</script>
<script type="module">
import * as THREE from 'three';
import { EffectComposer } from 'three/addons/postprocessing/EffectComposer.js';
import { RenderPass } from 'three/addons/postprocessing/RenderPass.js';
import { UnrealBloomPass } from 'three/addons/postprocessing/UnrealBloomPass.js';
import { OutputPass } from 'three/addons/postprocessing/OutputPass.js';
import { Reflector } from 'three/addons/objects/Reflector.js';
import { mergeGeometries } from 'three/addons/utils/BufferGeometryUtils.js';

/* ---------------- utilities ---------------- */
function mulberry32(a){return function(){a|=0;a=a+0x6D2B79F5|0;let t=Math.imul(a^a>>>15,1|a);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296;}}
const rand=mulberry32(20871024);
const R=(a,b)=>a+(b-a)*rand();
const pick=a=>a[Math.floor(rand()*a.length)];
const clamp=(v,a,b)=>Math.max(a,Math.min(b,v));
const ss=(a,b,x)=>{const t=clamp((x-a)/(b-a),0,1);return t*t*(3-2*t);};
const lerp=(a,b,t)=>a+(b-a)*t;
const wrapA=a=>{while(a>Math.PI)a-=Math.PI*2;while(a<-Math.PI)a+=Math.PI*2;return a;};
const store={get(k){try{return localStorage.getItem('yokocho-'+k);}catch(e){return null;}},set(k,v){try{localStorage.setItem('yokocho-'+k,v);}catch(e){}}};

const isTouch=matchMedia('(pointer: coarse)').matches;
const small=Math.min(innerWidth,innerHeight)<700;

/* ---------------- world shape ---------------- */
const HALF=4, LEN=70, STREET=14;          // alley half-width, alley half-length, cross-street depth
const NEON=['#ff2bd6','#2be8ff','#ffd12b','#ff4a3d','#8a6bff','#3dff8b','#ff8a2b','#ff5fa2'];
const SHOPS=[
  {k:'ramen',name:'ラーメン 龍',sub:'RAMEN · RYU',col:'#ffb347',noren:'#1d2b5a',norenTxt:'らーめん',steam:true},
  {k:'izakaya',name:'居酒屋 灯',sub:'IZAKAYA',col:'#ff6b3d',noren:'#7a1a14',norenTxt:'酒処灯',lantern:true},
  {k:'konbini',name:'ネオマート',sub:'24H MART',col:'#c9f3ff',bright:true},
  {k:'arcade',name:'ゲームセンター',sub:'ARCADE',col:'#ff2bd6'},
  {k:'bar',name:'BAR 夜猫',sub:'NIGHT CAT',col:'#8a6bff'},
  {k:'gyoza',name:'餃子 満月',sub:'GYOZA',col:'#ffd12b',noren:'#3a2410',norenTxt:'餃子',lantern:true,steam:true},
  {k:'parts',name:'電脳パーツ',sub:'CYBER PARTS',col:'#2be8ff'},
  {k:'karaoke',name:'カラオケ',sub:'KARAOKE BOX',col:'#ff5fa2'},
  {k:'tea',name:'喫茶 星屑',sub:'KISSATEN',col:'#ffcf8a'},
  {k:'yakitori',name:'焼鳥 鈴',sub:'YAKITORI',col:'#ff8a2b',noren:'#1a1a1a',norenTxt:'焼鳥',lantern:true,steam:true},
  {k:'ink',name:'彫師 蓮',sub:'TATTOO',col:'#3dff8b'},
  {k:'shutter',closed:true},{k:'shutter',closed:true}
];
const BLADES=['ラーメン','居酒屋','カラオケ','焼鳥','寿司','喫茶','占い','電脳','酒場','夜市','未来','質屋','整体','麻雀','餃子','古着','書店','ゲーム','天ぷら','ネオン','うどん','屋台','中華','BAR','24H','HOTEL','雀荘','漫画','薬局','龍'];
const ROOF=['東京電脳','夜の街','NEO 2087','猫カフェ','未来銀行','HOTEL 月'];
const MENU=['ラーメン ¥900','餃子 ¥450','生ビール','焼鳥 ¥300','日本酒','味噌','醤油','塩'];
const TAGS=['NO FUTURE','夜','ネコ','2087','GHOST','雨'];
const SIGNF="'Zen Kaku Gothic New','Hiragino Sans','Yu Gothic','Noto Sans JP',sans-serif";
const JPF="'Dela Gothic One','Hiragino Sans','Yu Gothic','Noto Sans JP',sans-serif";
{
  const all=[...SHOPS.flatMap(s=>[s.name||'',s.sub||'',s.norenTxt||'']),...BLADES,...ROOF,...MENU,...TAGS,'電脳東京深夜放送雨の夜'].join('');
  try{await Promise.race([Promise.all([document.fonts.load(`64px 'Dela Gothic One'`,all),document.fonts.load(`700 64px 'Zen Kaku Gothic New'`,all),document.fonts.load(`600 26px 'Chakra Petch'`)]),new Promise(r=>setTimeout(r,3500))]);}catch(e){}
}

/* ---------------- renderer, scene, camera ---------------- */
const canvas=document.getElementById('scene');
const renderer=new THREE.WebGLRenderer({canvas,antialias:false,powerPreference:'high-performance'});
const PR=Math.min(devicePixelRatio,small?1.5:1.75);
renderer.setPixelRatio(PR);renderer.setSize(innerWidth,innerHeight);
renderer.toneMapping=THREE.ACESFilmicToneMapping;renderer.toneMappingExposure=1.05;
const scene=new THREE.Scene();
scene.background=new THREE.Color('#06040c');
scene.fog=new THREE.FogExp2('#160c24',0.016);
const camera=new THREE.PerspectiveCamera(58,innerWidth/innerHeight,0.1,700);
const composer=new EffectComposer(renderer,new THREE.WebGLRenderTarget(1,1,{type:THREE.HalfFloatType,samples:small?0:4}));
composer.setPixelRatio(PR);composer.setSize(innerWidth,innerHeight);
composer.addPass(new RenderPass(scene,camera));
const bloom=new UnrealBloomPass(new THREE.Vector2(innerWidth,innerHeight),0.55,0.45,0.82);
composer.addPass(bloom);composer.addPass(new OutputPass());
scene.add(new THREE.HemisphereLight('#5b4fd0','#1a0a16',0.55));

/* ---------------- materials + canvas helpers ---------------- */
const mc={};
function M(c,o){const k='s'+c+(o?JSON.stringify(o):'');return mc[k]||(mc[k]=new THREE.MeshStandardMaterial(Object.assign({color:c,roughness:0.8},o||{})));}
function E(c,k=1.6,fog=true){const key='e'+c+k+fog;if(!mc[key]){const m=new THREE.MeshBasicMaterial({color:c,fog});m.color.multiplyScalar(k);mc[key]=m;}return mc[key];}
const BOX=new THREE.BoxGeometry(1,1,1);
function bx(w,h,d,mat,x=0,y=0,z=0,parent=scene){const m=new THREE.Mesh(BOX,mat);m.scale.set(w,h,d);m.position.set(x,y,z);parent.add(m);return m;}
function cv(w,h,draw){const c=document.createElement('canvas');c.width=w;c.height=h;draw(c.getContext('2d'),w,h);return c;}
function tex(c,o={}){const t=new THREE.CanvasTexture(c);t.colorSpace=o.data?THREE.NoColorSpace:THREE.SRGBColorSpace;t.anisotropy=8;if(o.rep)t.wrapS=t.wrapT=THREE.RepeatWrapping;return t;}
const mixHex=(a,b,t)=>'#'+new THREE.Color(a).lerp(new THREE.Color(b),t).getHexString();
function glow(x,txt,X,Y,col,blur){x.save();x.fillStyle=col;x.shadowColor=col;for(const b of [blur,blur*0.45]){x.shadowBlur=b;x.fillText(txt,X,Y);}x.shadowBlur=blur*0.15;x.fillStyle=mixHex(col,'#ffffff',0.4);x.fillText(txt,X,Y);x.restore();}
function noise(x,w,h,n,a){for(let i=0;i<n;i++){x.fillStyle=`rgba(${rand()<0.5?'255,255,255':'0,0,0'},${rand()*a})`;x.fillRect(rand()*w,rand()*h,1+rand()*3,1+rand()*3);}}
/* a scaled unit box whose uvs tile a texture every ts metres (faces: px,nx,py,ny,pz,nz) */
function tiledBox(w,h,d,ts,off=[0,0]){
  const g=new THREE.BoxGeometry(w,h,d),uv=g.attributes.uv,dims=[[d,h],[d,h],[w,d],[w,d],[w,h],[w,h]];
  for(let f=0;f<6;f++)for(let v=0;v<4;v++){const i=f*4+v;uv.setXY(i,uv.getX(i)*dims[f][0]/ts[0]+off[0],uv.getY(i)*dims[f][1]/ts[1]+off[1]);}
  return g;
}

/* draw-call batching: bake meshes into one geometry per material */
function bakeGeo(o,m){const g=o.geometry.index?o.geometry.toNonIndexed():o.geometry.clone();for(const k of Object.keys(g.attributes))if(!['position','normal','uv'].includes(k))g.deleteAttribute(k);g.applyMatrix4(m);return g;}
function sliceGeo(g,start,count){const n=new THREE.BufferGeometry();for(const k of ['position','normal','uv']){const a=g.attributes[k];n.setAttribute(k,new THREE.BufferAttribute(a.array.slice(start*a.itemSize,(start+count)*a.itemSize),a.itemSize));}return n;}
function bucketMesh(buckets,o,m){const g=bakeGeo(o,m);
  if(Array.isArray(o.material)){for(const gr of g.groups){const mt=o.material[gr.materialIndex];if(!buckets.has(mt))buckets.set(mt,[]);buckets.get(mt).push(sliceGeo(g,gr.start,gr.count));}}
  else{g.clearGroups();if(!buckets.has(o.material))buckets.set(o.material,[]);buckets.get(o.material).push(g);}}
function emitBuckets(buckets,parent){for(const [mt,list] of buckets){const mg=mergeGeometries(list,false);if(mg)parent.add(new THREE.Mesh(mg,mt));}}
/* merge a group's direct mesh children (they move together) */
function mergeChildren(grp){const buckets=new Map(),dead=[];for(const o of grp.children){if(!o.isMesh||o.isInstancedMesh)continue;o.updateMatrix();bucketMesh(buckets,o,o.matrix);dead.push(o);}dead.forEach(o=>grp.remove(o));emitBuckets(buckets,grp);}

/* ---------------- textures ---------------- */
function facadeSet(base,trim,litP){
  const lit=[];
  const map=cv(512,1024,(x,w,h)=>{x.fillStyle=base;x.fillRect(0,0,w,h);noise(x,w,h,5000,0.06);
    for(let f=0;f<4;f++){x.fillStyle=trim;x.fillRect(0,f*256,w,10);
      for(let i=0;i<4;i++){const wx=i*128+22,wy=f*256+64,ww=84,wh=128;x.fillStyle='#0a0a10';x.fillRect(wx,wy,ww,wh);x.fillStyle=trim;x.fillRect(wx-5,wy+wh,ww+10,7);
        if(rand()<litP)lit.push({wx,wy,ww,wh,c:pick(['#ffcf8e','#ffe2b8','#9fd2ff','#ff9ad8','#bfffe0','#ffcf8e']),bl:rand()<0.4,sil:rand()<0.2});
        if(rand()<0.18){x.fillStyle='#8d9096';x.fillRect(wx+12,wy+wh+12,58,36);x.fillStyle='#45474d';x.beginPath();x.arc(wx+41,wy+wh+30,13,0,7);x.fill();}}}
    x.strokeStyle='rgba(0,0,0,.35)';x.lineWidth=3;for(let i=0;i<5;i++){x.beginPath();const sx=rand()*w;x.moveTo(sx,0);x.lineTo(sx+R(-20,20),h);x.stroke();}});
  const em=cv(512,1024,(x,w,h)=>{x.fillStyle='#000';x.fillRect(0,0,w,h);
    for(const L of lit){const g=x.createLinearGradient(0,L.wy,0,L.wy+L.wh);g.addColorStop(0,L.c);g.addColorStop(1,mixHex(L.c,'#000000',0.45));x.fillStyle=g;x.fillRect(L.wx,L.wy,L.ww,L.wh);
      x.fillStyle='rgba(0,0,0,.55)';if(L.bl)for(let y=L.wy+6;y<L.wy+L.wh;y+=9)x.fillRect(L.wx,y,L.ww,4);
      x.fillRect(L.wx+L.ww/2-2,L.wy,4,L.wh);
      if(L.sil){x.fillStyle='rgba(0,0,0,.8)';x.beginPath();x.arc(L.wx+30,L.wy+70,12,0,7);x.fill();x.fillRect(L.wx+14,L.wy+84,32,50);}}});
  return {map:tex(map,{rep:1}),em:tex(em,{rep:1})};
}
const FACADES=[facadeSet('#3b3a44','#55545e',0.45),facadeSet('#4a4038','#635649',0.4),facadeSet('#2a3340','#3c4757',0.5),facadeSet('#463646','#5d4a5c',0.42)].map(f=>new THREE.MeshStandardMaterial({map:f.map,emissiveMap:f.em,emissive:'#ffffff',emissiveIntensity:0.7,roughness:0.92}));

function bladeTex(text,col){
  const latin=/^[A-Z0-9 ]+$/.test(text),chars=[...text],n=latin?text.length*0.62:chars.length;
  const w=160,h=Math.round(Math.max(2.4,n*0.98+0.55)*w);
  return tex(cv(w,h,(x)=>{x.fillStyle='#0d0710';x.fillRect(0,0,w,h);
    x.save();x.strokeStyle=col;x.lineWidth=7;x.shadowColor=col;x.shadowBlur=20;x.strokeRect(12,12,w-24,h-24);x.restore();
    x.textAlign='center';x.textBaseline='middle';
    if(latin){x.save();x.translate(w/2,h/2);x.rotate(Math.PI/2);x.font=`${Math.min(w*0.56,(h-60)/(text.length*0.66))}px ${JPF}`;glow(x,text,0,4,col,24);x.restore();}
    else{const st=(h-40)/chars.length,fs=Math.min(w*0.64,st*0.9);x.font=`700 ${fs}px ${SIGNF}`;chars.forEach((ch,i)=>glow(x,ch,w/2,20+st*(i+0.5)+fs*0.04,col,16));}}));
}
function signTex(name,sub,col){
  return tex(cv(1024,200,(x,w,h)=>{const g=x.createLinearGradient(0,0,0,h);g.addColorStop(0,'#160c1c');g.addColorStop(1,'#0a060c');x.fillStyle=g;x.fillRect(0,0,w,h);
    x.save();x.strokeStyle=col;x.lineWidth=6;x.shadowColor=col;x.shadowBlur=18;x.strokeRect(10,10,w-20,h-20);x.restore();
    x.textAlign='center';x.textBaseline='middle';x.font=`700 ${Math.min(108,880/[...name].length*1.1)}px ${SIGNF}`;glow(x,name,w/2,86,col,14);
    x.font=`600 34px 'Chakra Petch',sans-serif`;if('letterSpacing' in x)x.letterSpacing='10px';glow(x,sub,w/2,160,mixHex(col,'#ffffff',0.3),12);}));
}
function interiorTex(s){
  return tex(cv(512,256,(x,w,h)=>{
    if(s.closed){x.fillStyle='#5b5e66';x.fillRect(0,0,w,h);for(let y=0;y<h;y+=8){x.fillStyle='rgba(0,0,0,.28)';x.fillRect(0,y,w,3);x.fillStyle='rgba(255,255,255,.08)';x.fillRect(0,y+4,w,1);}
      noise(x,w,h,2500,0.12);x.save();x.translate(R(140,370),R(100,170));x.rotate(R(-0.2,0.1));x.font=`${R(46,70)|0}px ${JPF}`;x.textAlign='center';x.fillStyle=pick(NEON);x.globalAlpha=0.75;x.fillText(pick(TAGS),0,0);x.restore();
      x.fillStyle='rgba(0,0,0,.4)';x.fillRect(0,h-10,w,10);return;}
    const g=x.createLinearGradient(0,0,0,h);
    if(s.k==='konbini'){g.addColorStop(0,'#ffffff');g.addColorStop(1,'#cfe6f2');x.fillStyle=g;x.fillRect(0,0,w,h);
      for(let r=0;r<4;r++){const y=40+r*50;x.fillStyle='#9fb3bf';x.fillRect(0,y+34,w,6);for(let i=0;i<34;i++){x.fillStyle=pick(['#ff4a3d','#2b7bff','#ffd12b','#3dbb6b','#ff8ac2','#ffffff','#ff8a2b']);x.fillRect(6+i*15,y+R(4,14),11,34-R(4,14));}}

      else{desired=Math.atan2(dx,dz);tgt=p.vmax;

  for(const c of cars){c.s+=c.v*dt;if(c.s>280)c.s=-280;const dx=Math.cos(c.a),dz=Math.sin(c.a);c.g.position.set(dx*c.s-dz*c.o,c.y,dz*c.s+dx*c.o);c.g.rotation.y=-c.a;}
  if(++hf%4===0)for(const h of HOLOS)h(T);
  if(steam.n){for(let i=0;i<steam.n;i++){const q=steam.p[i];q.t+=dt;if(q.t>3.2){q.t=0;q.w=Math.random()*6;}const e=q.e,t=q.t;
    steam.pos[i*3]=e.x-e.s*t*0.28+Math.sin(t*1.7+q.w)*0.12;steam.pos[i*3+1]=e.y+t*0.55;steam.pos[i*3+2]=e.z+Math.sin(t*1.3+q.w)*0.2;
    steam.a[i]=Math.sin(Math.PI*t/3.2)*0.2;steam.sz[i]=0.35+t*0.45;}
    steam.g.attributes.position.needsUpdate=true;steam.g.attributes.aA.needsUpdate=true;steam.g.attributes.aS.needsUpdate=true;}
  composer.render();
});
document.getElementById('boot').hidden=true;
addEventListener('resize',()=>{camera.aspect=innerWidth/innerHeight;camera.updateProjectionMatrix();renderer.setSize(innerWidth,innerHeight);composer.setSize(innerWidth,innerHeight);
  puddles.getRenderTarget().setSize(Math.round(innerWidth*PR*0.5),Math.round(innerHeight*PR*0.5));setScale();});
</script>
